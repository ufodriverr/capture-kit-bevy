[workspace]
resolver = "3"
members = ["crates/ck_core", "crates/ck_game"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Bevy 0.19.1 is the newest supported by avian3d 0.7.
bevy = { version = "=0.19.1" }
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "default-collider", "parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ron = "0.12"
rand_core = "0.10"
rand_chacha = "0.10.0"
anyhow = "1"
ck_core = { path = "crates/ck_core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 16
